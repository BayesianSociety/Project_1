[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-multi-agent-workflow"
version = "0.1.0"
description = "Codex-only multi-agent workflow orchestrator"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
codex-multi-agent = "codex_multi_agent.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
